name: Clean Inactive Deployments

on:
  workflow_dispatch:

permissions:
  deployments: write

jobs:
  clean-deployments:
    runs-on: ubuntu-latest
    steps:
      - name: Clean Inactive GitHub Deployments
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            console.log(`Fetching deployments for ${owner}/${repo}...`);
            const deployments = await github.rest.repos.listDeployments({
              owner,
              repo,
              per_page: 100,
            });

            console.log(`Found ${deployments.data.length} total deployments.`);

            for (const deployment of deployments.data) {
              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
              });

              // Check if any status is inactive or if it has no active status
              const hasActiveStatus = statuses.data.some(s => s.state === 'success');
              const isInactive = statuses.data.some(s => s.state === 'inactive') || !hasActiveStatus;

              if (isInactive) {
                console.log(`Deactivating and deleting inactive deployment ID: ${deployment.id} (${deployment.environment})...`);
                try {
                  // Ensure deployment is inactive before deleting
                  await github.rest.repos.createDeploymentStatus({
                    owner,
                    repo,
                    deployment_id: deployment.id,
                    state: 'inactive',
                  });
                } catch (_) {}

                try {
                  await github.rest.repos.deleteDeployment({
                    owner,
                    repo,
                    deployment_id: deployment.id,
                  });
                  console.log(`Successfully deleted deployment ${deployment.id}.`);
                } catch (delErr) {
                  console.error(`Failed to delete deployment ${deployment.id}:`, delErr.message);
                }
              }
            }
